# Alembic configuration for the PostgreSQL datastore (ADR-0002).
#
# The database URL comes from DATABASE_URL (or .env); it is deliberately not
# stored here. Prefer `uv run python -m venture_intelligence.storage.pg upgrade`,
# which uses the same migrations without needing this file.

[alembic]
script_location = %(here)s/backend/venture_intelligence/storage/pg/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
