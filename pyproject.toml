[project]
name = "venture-intelligence"
version = "0.1.0"
description = "Configuration-driven, evidence-oriented venture intelligence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "playwright>=1.44",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "arxiv>=4.0.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Hatch metadata supports the editable install used by the source-checkout
# workflow. Standalone wheel/PyPI distribution is not supported in this release.
packages = ["backend/venture_intelligence"]

# Preserve the repository assets in internal build artifacts without promising
# that those artifacts are a supported standalone distribution.
[tool.hatch.build.targets.wheel.force-include]
frontend = "frontend"
config = "config"

[project.scripts]
venture-intelligence = "venture_intelligence.cli:main"
vi = "venture_intelligence.cli:main"


# ── uv settings ───────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.10",
]


# ── Ruff linter ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
# Keep test fixtures inside the checkout.  This avoids relying on a locked or
# policy-restricted Windows %TEMP% directory while leaving production data
# untouched.
addopts = "--basetemp=.pytest-tmp"
markers = [
    "postgres: needs an ephemeral PostgreSQL (VI_TEST_DATABASE_URL or Docker via testcontainers)",
]
