name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, revamp-main]

permissions:
  contents: read

jobs:
  guards:
    name: git guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PR must not target main
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/git/guards.py pr-base "$BASE_REF"
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/git/guards.py subject "$TITLE"
      - name: Head branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python scripts/git/guards.py branch "$HEAD_REF"
      - name: Every PR commit is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/git/guards.py range "$BASE_SHA..$HEAD_SHA"
      - name: Pushes to protected branches arrive only as PR merges
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A push to main/revamp-main must correspond to a merged PR; anything
          # else is a direct push and fails loudly so the owner sees it.
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'map(select(.merged_at != null)) | length')
          if [ "${prs:-0}" = "0" ]; then
            echo "::error::$REF_NAME received a direct push ($SHA) not tied to a merged PR"
            exit 1
          fi
      - name: Every pushed commit is a Conventional Commit
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Branch creation push; no previous tip to diff against."
            exit 0
          fi
          python scripts/git/guards.py range "$BEFORE..$SHA"

  python:
    name: offline python suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - run: uv run ruff check .
      # Some API tests assert that the built React app is served at /, so
      # build frontend/dist before running pytest.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv run pytest -q

  frontend:
    name: frontend lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
